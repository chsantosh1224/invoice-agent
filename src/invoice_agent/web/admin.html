<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Invoice Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth.css">
<style>
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .head .count { color: var(--muted); font-size: 14px; }
  .head .right { margin-left: auto; display: flex; gap: 8px; }
  .table-wrap { border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; background: #fff; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; background: #f9fafb;
       border-bottom: 1px solid var(--line); padding: 10px 14px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 12px 14px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  .who b { display: block; }
  .who span { color: var(--muted); font-size: 13px; }
  .reason { color: var(--muted); max-width: 340px; white-space: pre-wrap; word-break: break-word; }
  .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .chip.pending { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
  .chip.active { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .chip.invited { background: var(--accent-soft); color: var(--accent); border-color: #c7d2fe; }
  .chip.off { background: #f2f4f7; color: var(--muted); border-color: var(--line-strong); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  #invite { display: none; margin-bottom: 18px; }
  #invite.show { display: block; }
  .link-row { display: flex; gap: 8px; margin-top: 10px; }
  .link-row input { font-family: var(--mono); font-size: 13px; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
  <div class="brand"><a href="/">Invoice Agent</a></div>
  <div class="tag">Admin</div>
</div></div>

<div class="wide">
  <div class="head">
    <h1>Access requests &amp; users</h1>
    <span class="count" id="count"></span>
    <div class="right">
      <button class="small ghost" id="refresh" type="button">Refresh</button>
      <button class="small ghost" id="back" type="button">Back to the app</button>
    </div>
  </div>

  <div class="card" id="invite">
    <h1 style="font-size:17px">Invite link for <span id="inviteName"></span></h1>
    <p class="lede" style="margin:0">Send this link to them yourself (Upwork, email, WhatsApp). It works
      once and expires in 7 days.</p>
    <div class="link-row">
      <input id="inviteUrl" readonly>
      <button class="small" id="copy" type="button">Copy</button>
    </div>
    <p class="hint">Opening it lets them set a password. Don't open it yourself: that would use it up.</p>
  </div>

  <div class="msg" id="msg" role="alert"></div>
  <div class="table-wrap" style="margin-top:12px">
    <table>
      <thead><tr><th>Person</th><th>Why</th><th>Requested</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const msg = document.getElementById("msg");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;  // never innerHTML: user input
  return node;
}

function when(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

function status(user) {
  if (user.status === "pending") return ["Pending", "pending"];
  if (user.status === "approved" && user.has_password) return ["Active", "active"];
  if (user.status === "approved") return ["Invited", "invited"];
  return [user.status === "rejected" ? "Rejected" : "Disabled", "off"];
}

function button(label, className, onClick) {
  const b = el("button", `small ${className}`, label);
  b.type = "button";
  b.addEventListener("click", async () => { b.disabled = true; await onClick(); b.disabled = false; });
  return b;
}

async function call(path, options) {
  const resp = await fetch(path, options);
  if (resp.status === 401) { location.href = "/?login"; throw new Error("Logged out"); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.detail || `Request failed (${resp.status})`);
  return data;
}

function showError(err) { msg.textContent = String(err.message || err); msg.className = "msg error"; }

async function act(user, action) {
  msg.className = "msg";
  if (action !== "approve" && !confirm(`${action === "reject" ? "Reject" : "Disable"} ${user.name} (${user.email})?`)) return;
  try {
    const data = await call(`/api/admin/users/${user.id}/${action}`, { method: "POST" });
    if (data.invite_url) {
      document.getElementById("inviteName").textContent = `${user.name} (${user.email})`;
      document.getElementById("inviteUrl").value = data.invite_url;
      document.getElementById("invite").className = "card show";
      document.getElementById("invite").scrollIntoView({ behavior: "smooth" });
    }
    await load();
  } catch (err) { showError(err); }
}

function actions(user) {
  const box = el("div", "actions");
  if (user.is_admin) { box.append(el("span", "when", "You (admin)")); return box; }
  if (user.status === "pending") {
    box.append(button("Approve", "", () => act(user, "approve")), button("Reject", "danger", () => act(user, "reject")));
  } else if (user.status === "approved") {
    const label = user.has_password ? "Password reset link" : "New invite link";
    box.append(button(label, "ghost", () => act(user, "approve")), button("Disable", "danger", () => act(user, "disable")));
  } else {
    box.append(button("Approve", "ghost", () => act(user, "approve")));
  }
  return box;
}

async function load() {
  try {
    const { users } = await call("/api/admin/users");
    const rows = document.getElementById("rows");
    rows.replaceChildren();
    const pending = users.filter((u) => u.status === "pending").length;
    document.getElementById("count").textContent =
      `${pending} pending · ${users.filter((u) => u.status === "approved").length} with access`;
    if (!users.length) {
      const td = el("td", "empty", "No requests yet. Share the request-access page: /request-access");
      td.colSpan = 6;
      const tr = el("tr");
      tr.append(td);
      rows.append(tr);
      return;
    }
    for (const user of users) {
      const tr = el("tr");
      const who = el("td", "who");
      who.append(el("b", "", user.name), el("span", "", user.email));
      if (user.company) who.append(el("span", "", ` · ${user.company}`));
      const [label, cls] = status(user);
      const chip = el("td");
      chip.append(el("span", `chip ${cls}`, label));
      const act = el("td");
      act.append(actions(user));
      tr.append(who, el("td", "reason", user.reason || "—"), el("td", "when", when(user.created_at)),
                chip, el("td", "when", when(user.last_login)), act);
      rows.append(tr);
    }
  } catch (err) { showError(err); }
}

document.getElementById("copy").addEventListener("click", async () => {
  const input = document.getElementById("inviteUrl");
  try { await navigator.clipboard.writeText(input.value); } catch { input.select(); document.execCommand("copy"); }
  document.getElementById("copy").textContent = "Copied";
  setTimeout(() => { document.getElementById("copy").textContent = "Copy"; }, 1500);
});
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("back").addEventListener("click", () => { location.href = "/app"; });
load();
</script>
</body>
</html>
