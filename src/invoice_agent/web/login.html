<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Invoice Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
  <div class="brand">Invoice Agent</div>
  <div class="tag">AI extraction · verified by code</div>
</div></div>

<div class="narrow">
  <form class="card" id="form">
    <h1>Log in</h1>
    <p class="lede">Use the email and password from your invite.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="full" id="submit" type="submit">Log in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt">No account yet? <a href="/request-access">Request access</a></p>
  <p class="credit">Built by <b>Santosh Ch</b></p>
</div>

<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("submit");
  button.disabled = true;
  msg.className = "msg";
  try {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    if (resp.ok) { location.href = "/"; return; }
    const data = await resp.json().catch(() => ({}));
    msg.textContent = data.detail || `Login failed (${resp.status})`;
    msg.className = "msg error";
  } catch (err) {
    msg.textContent = "Couldn't reach the server. Check your connection.";
    msg.className = "msg error";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
