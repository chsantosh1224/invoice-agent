<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Set your password · Invoice Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
  <div class="brand">Invoice Agent</div>
  <div class="tag">AI extraction · verified by code</div>
</div></div>

<div class="narrow">
  <form class="card" id="form">
    <h1>Welcome! Set your password</h1>
    <p class="lede">Your access has been approved. Choose a password (at least 10 characters)
      to finish setting up your account.</p>
    <label for="password">New password</label>
    <input id="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required>
    <label for="confirm">Repeat password</label>
    <input id="confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required>
    <button class="full" id="submit" type="submit">Set password and continue</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="credit">Built by <b>Santosh Ch</b></p>
</div>

<script>
// The token is in the #fragment, which browsers never send to servers.
const token = location.hash.slice(1);
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const button = document.getElementById("submit");
function showError(text) { msg.textContent = text; msg.className = "msg error"; }
if (!token) {
  showError("This link is incomplete. Please open the full invite link you received.");
  button.disabled = true;
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  if (password !== document.getElementById("confirm").value) {
    showError("The passwords don't match.");
    return;
  }
  button.disabled = true;
  msg.className = "msg";
  try {
    const resp = await fetch("/api/invite/accept", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    if (resp.ok) { location.replace("/"); return; }
    const data = await resp.json().catch(() => ({}));
    showError(typeof data.detail === "string" ? data.detail : "Use at least 10 characters.");
  } catch (err) {
    showError("Couldn't reach the server. Check your connection.");
  }
  button.disabled = false;
});
</script>
</body>
</html>
