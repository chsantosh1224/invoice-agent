<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request access · Invoice Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
  <div class="brand"><a href="/">Invoice Agent</a></div>
  <div class="tag">AI extraction · verified by code</div>
</div></div>

<div class="narrow">
  <form class="card" id="form">
    <h1>Request access</h1>
    <p class="lede">Tell me a little about yourself. Once I approve, you'll receive a personal
      invite link to set your password.</p>
    <label for="name">Name</label>
    <input id="name" maxlength="100" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" maxlength="254" autocomplete="email" required>
    <label for="company">Company <span class="opt">(optional)</span></label>
    <input id="company" maxlength="100" autocomplete="organization">
    <label for="reason">What would you like to try? <span class="opt">(optional)</span></label>
    <textarea id="reason" maxlength="1000"></textarea>
    <div class="hp" aria-hidden="true">
      <label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off">
    </div>
    <button class="full" id="submit" type="submit">Send request</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt">Already invited? <a href="/?login">Log in</a></p>
  <p class="credit">Built by <b>Santosh Ch</b></p>
</div>

<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const value = (id) => document.getElementById(id).value;
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("submit");
  button.disabled = true;
  msg.className = "msg";
  try {
    const resp = await fetch("/api/access-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: value("name"), email: value("email"), company: value("company"),
        reason: value("reason"), website: value("website"),
      }),
    });
    if (resp.ok) {
      form.querySelectorAll("input, textarea, button").forEach((el) => { el.disabled = true; });
      msg.textContent = "Thanks! Your request has been sent. You'll hear back by email or message once it's approved.";
      msg.className = "msg ok";
      return;
    }
    const data = await resp.json().catch(() => ({}));
    msg.textContent = typeof data.detail === "string" ? data.detail : "Please check the fields and try again.";
    msg.className = "msg error";
    button.disabled = false;
  } catch (err) {
    msg.textContent = "Couldn't reach the server. Check your connection.";
    msg.className = "msg error";
    button.disabled = false;
  }
});
</script>
</body>
</html>
