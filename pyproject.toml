[project]
name = "invoice-agent"
version = "0.1.0"
description = "AI invoice processing: layout-aware extraction workflow, extraction agent, and 3-way match."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.6",
    "langchain-openai>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pdfplumber>=0.11.10",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# Heavy (PyTorch). Optional: only the ingestion comparison / agent path may need it.
docling = ["docling>=2.0", "torch", "torchvision"]

[project.scripts]
invoice-agent = "invoice_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
]
synth = [
    "faker>=40.43.0",
    "jinja2>=3.1.6",
    "playwright>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "synth"]  # tests import the generator; CI needs both

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # every function documents purpose, Args, Returns, Raises

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests carry a one-line purpose docstring; Args sections not required

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langgraph.*", "pypdfium2.*", "psutil.*", "rapidocr.*", "pdfplumber.*", "docling.*", "docling_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: calls real LLMs and costs money; run with `pytest -m eval`",
    "live: needs OPENROUTER_API_KEY",
]
addopts = "-m 'not eval and not live'"

# On Linux (EC2/Docker) take CPU-only PyTorch (~250 MB) instead of the CUDA build (~2.5 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
